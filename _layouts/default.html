<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}" data-i18n="nav_home">Home</a>
      <a href="{{ '/dynasties.html' | relative_url }}" data-i18n="nav_dynasties">Dynasties</a>
      <a href="{{ '/rulers.html' | relative_url }}" data-i18n="nav_rulers">Rulers</a>
      <a href="{{ '/wars.html' | relative_url }}" data-i18n="nav_wars">Wars</a>
    </div>
    <div class="lang-toggle">
      <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
      <button id="lang-hi" onclick="setLang('hi')">हिंदी</button>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>Chronomap — Interactive Historical Atlas</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ '/assets/js/i18n.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% if page.layout == 'home' %}
  <script src="{{ '/assets/js/map.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/timeline.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/panel.js' | relative_url }}"></script>
  {% endif %}
  {% if page.layout == 'detail' %}
  <script src="{{ '/assets/js/detail.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
